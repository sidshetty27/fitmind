name: CI

# Runs the checks `docs/phase-5-testing.md` and `docs/phase-7-testing.md` ask for
# before committing, so a pull request proves them rather than relying on someone
# remembering. Both suites are fast and hermetic — no database, no secrets, no
# network — which is what makes it reasonable to run them on every push.

on:
  pull_request:
  push:
    branches: [main]

# A newer push makes the in-flight run irrelevant. Cancelling keeps the queue
# honest and stops a burst of commits from serialising behind stale jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only: nothing here writes to the repo, so nothing here needs to be able to.
permissions:
  contents: read

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # No DATABASE_URL is set on purpose. `tests/conftest.py` points the app at a
      # deliberately unreachable database before anything imports `app.*`, which is
      # what lets the readiness endpoint's failure path be tested deterministically
      # here. The handful of tests that need real Postgres opt in via
      # TEST_DATABASE_URL and skip without it.
      - name: Run tests
        run: python -m pytest -q

  frontend:
    name: frontend (typecheck, lint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # `!cancelled()` rather than the default: a type error and a lint error are
      # independent problems, and finding out about them one run at a time is the
      # slowest way to fix both.
      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

      # Not guarded — a build on top of broken types tells you nothing you did not
      # already learn from the typecheck, and it is the expensive step.
      #
      # Needs no Clerk keys: every authenticated route renders on demand rather
      # than prerendering, so nothing reaches Clerk at build time.
      #
      # It does need NEXT_PUBLIC_API_URL. `next.config.ts` fails a production
      # build without one, because the value is inlined into the client bundle
      # and its absence produces an app that calls the visitor's own machine.
      # The placeholder is never called — nothing here makes a request — but it
      # keeps CI exercising the same code path Vercel does, rather than a
      # special case that would let the real failure through.
      - name: Build
        env:
          NEXT_PUBLIC_API_URL: https://fitmind-api.invalid
        run: npm run build

  # The deployment artifact, built and booted (Phase 9).
  #
  # `pytest` proves the code is correct; it says nothing about whether the thing
  # Render actually runs will start. Those fail differently — a missing wheel, a
  # CRLF shebang, a bind to the wrong interface — and without this job you find
  # out from a crash-looping deploy instead of from a pull request.
  image:
    name: backend (docker build + boot)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          tags: fitmind-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Boot it and require a real 200 from the liveness probe.
      #
      # RUN_MIGRATIONS=false because there is no database here: the point is to
      # prove the image starts, binds $PORT on 0.0.0.0, and serves — not to
      # re-test Alembic. DATABASE_URL is still required for Settings to
      # validate, so it gets a syntactically valid DSN that is never connected
      # to. PORT is deliberately not 8000, which is what would catch the
      # entrypoint hardcoding a port instead of reading the platform's.
      - name: Boot it and probe /health
        run: |
          docker run -d --name api \
            -e DATABASE_URL='postgresql://u:p@127.0.0.1:5432/db' \
            -e RUN_MIGRATIONS=false \
            -e PORT=9137 \
            -p 9137:9137 \
            fitmind-api:ci

          for i in $(seq 1 30); do
            if curl -fsS http://localhost:9137/health > /tmp/health.json; then
              echo "healthy after ${i}s:"; cat /tmp/health.json; exit 0
            fi
            sleep 1
          done

          echo "::error::container never answered /health"
          docker logs api
          exit 1

      - name: Container logs
        if: ${{ failure() }}
        run: docker logs api
